server {
  listen 80;
  listen [::]:80;
  server_name @EXPLORER_HOST@;
  location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
  location = /maria-logo.png { root /var/www/maintenance; try_files /maria-logo.png =404; access_log off; }
  location / { return 503; }
  error_page 503 /maintenance.html;
  location = /maintenance.html { root /var/www/maintenance; internal; }
}
