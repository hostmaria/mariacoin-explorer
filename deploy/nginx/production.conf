map $request_method $maria_claim_client {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $maria_claim_client zone=mariacoin_claim:10m rate=6r/m;
server { listen 80; listen [::]:80; server_name @EXPLORER_HOST@; location ^~ /.well-known/acme-challenge/ { root /var/www/acme; } location / { return 301 https://$host$request_uri; } }
server {
 listen 443 ssl http2; listen [::]:443 ssl http2; server_name @EXPLORER_HOST@;
 ssl_certificate /etc/letsencrypt/live/@EXPLORER_HOST@/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/@EXPLORER_HOST@/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3; add_header Strict-Transport-Security "max-age=31536000" always;
 location ^~ /system/restartexplorer { return 404; }
 location ~* ^/claim(?:/(challenge|submit))?/*$ { limit_req zone=mariacoin_claim burst=3 nodelay; limit_req_status 429; client_max_body_size 16k; proxy_pass http://127.0.0.1:3001; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
 location / { proxy_pass http://127.0.0.1:3001; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
}
