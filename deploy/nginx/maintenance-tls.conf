server { listen 80; listen [::]:80; server_name explorer.mariacoin.com; location ^~ /.well-known/acme-challenge/ { root /var/www/acme; } location / { return 301 https://$host$request_uri; } }
server {
 listen 443 ssl http2; listen [::]:443 ssl http2; server_name explorer.mariacoin.com;
 ssl_certificate /etc/letsencrypt/live/explorer.mariacoin.com/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/explorer.mariacoin.com/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 location = /system/restartexplorer { return 404; }
 location = /maria-logo.png { root /var/www/maintenance; try_files /maria-logo.png =404; access_log off; }
 location / { return 503; }
 error_page 503 /maintenance.html; location = /maintenance.html { root /var/www/maintenance; internal; }
}
